  - wrangler@4.145.0
  - '@cloudflare/workerd-darwin-64@1.20260930.2'
  - '@cloudflare/workerd-darwin-arm64@1.20260930.2'
  - '@cloudflare/workerd-linux-64@1.20260930.2'
  - '@cloudflare/workerd-linux-arm64@1.20260930.2'
  - '@cloudflare/workerd-windows-64@1.20260930.2'
  - floating-vue@5.4.0
  - workerd@1.20260930.2
  - lz-string-es@1.0.0
  - '@turbo/darwin-64@2.11.6'
  - '@turbo/darwin-arm64@2.11.6'
  - '@turbo/linux-64@2.11.6'
  - '@turbo/linux-arm64@2.11.6'
  - '@turbo/windows-64@2.11.6'
  - '@turbo/windows-arm64@2.11.6'
  - '@vitest/coverage-v8@5.0.3'
  - '@vitest/mocker@5.0.3'
  - '@vitest/spy@5.0.3'
  - turbo@2.11.6
  - vitest@5.0.3

trustPolicy: no-downgrade

update:
  ignoreDeps:
    - typescript@7

shellEmulator: true

packages:
  - packages/*
  - packages/*/playground
  - playground
  - examples/*
  - docs
  - bench/*

overrides:
  rollup: ^4.63.5
  semver: ^7.8.5

allowBuilds:
  esbuild: true
  pnpm: true
  sharp: true
  simple-git-hooks: true
  workerd: true

