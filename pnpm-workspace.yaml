ignoreWorkspaceRootCheck: true

minimumReleaseAgeExcludePrune: true
minimumReleaseAgeExclude:
  - '@types/node@25.9.0'
  - '@vue/language-core@3.3.0'
  - baseline-browser-mapping@2.10.31 || 2.11.22
  - pnpm@11.1.3
  - tsx@4.22.2
  - vue-tsc@3.3.0
  - fuse.js@7.4.1
  - miniflare@4.20260601.0 || 5.20260910.0-alpha
  - wrangler@4.97.0 || 4.131.0
  - tm-grammars@1.32.0 || 1.32.17
  - tm-themes@1.12.3
  - '@cloudflare/workerd-darwin-64@1.20260910.1'
  - '@cloudflare/workerd-darwin-arm64@1.20260910.1'
  - '@cloudflare/workerd-linux-64@1.20260910.1'
  - '@cloudflare/workerd-linux-arm64@1.20260910.1'
  - '@cloudflare/workerd-windows-64@1.20260910.1'
  - '@iconify-json/carbon@1.2.27'
  - floating-vue@5.4.0
  - lint-staged@17.5.1
  - magic-string@1.3.1
  - vite@8.3.0
  - workerd@1.20260910.1
  - lz-string-es@1.0.0

trustPolicy: no-downgrade

update:
  ignoreDeps:
    - typescript@7

shellEmulator: true

packages:
  - packages/*
  - packages/*/playground
  - playground
  - examples/*
  - docs
  - bench/*

overrides:
  rollup: ^4.63.1
  semver: ^7.8.5

allowBuilds:
  esbuild: true
  pnpm: true
  sharp: true
  simple-git-hooks: true
  workerd: true

